[project]
name = "werbanc"
version = "0.1.0"
description = "Desktop workbench for preparing tasks for local LLMs"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-only"
dependencies = [
    "lark>=1.3.1",
    "PyQt6>=6.7,<7",
    "PyQt6-QScintilla>=2.14.1,<3",
]

[project.optional-dependencies]
qt = [
    "PyQt6>=6.7,<7",
    "PyQt6-QScintilla>=2.14.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

# Пока исходников нет, uv управляет только окружением и зависимостями.
# При создании Python-пакета добавим build-system и точку входа.
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.gui-scripts]
werbanc-qt = "werbanc.ui.qt.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/werbanc"]
